version: '3'
services:
  api:
    build:
      context: .
      dockerfile: $PWD/app/Dockerfile
    environment:
      - ENV_STATE=test
    volumes:
      - $PWD/{{cookiecutter.project_name}}:/app
      - $PWD/log/supervisor:/var/log/supervisor
    depends_on:
      - mongo
  ui:
    image: nginx:stable-alpine
    ports:
      - '8080:443'
    volumes:
      - $PWD/nginx/dist/:/dist/
      - $PWD/nginx/conf/:/etc/nginx/conf.d/
      - $PWD/nginx/nginx.conf:/etc/nginx/nginx.conf
      - $PWD/log/nginx:/var/log/nginx

  redis:
    image: redis:latest
    restart: always
    ports:
      - '6379:6379'

  mongo:
    container_name: mongo
    build:
      context: ./mongo
      dockerfile: $PWD/mongo/Dockerfile
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: 123456
      MONGO_INITDB_DATABASE: proj # js文件的操作会在该数据库下完成
    volumes:
      - ./mongo/conf:/etc/mongo # 配置文件
      - ./mongo/log:/var/log/mongodb # 日志目录挂载
      - ./mongo/data:/data/db # 数据目录挂载
      - ./mongo/init:/docker-entrypoint-initdb.d # 初始化操作
    command: mongod --config /etc/mongo/mongod.conf # 指定上面的配置文件运行
