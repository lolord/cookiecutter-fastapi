services:
  {{cookiecutter.project_name}}_api:
    container_name: {{cookiecutter.project_name}}_api
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    environment:
      - ENV_STATE=dev
    command: sleep infinity
    depends_on:
      - {{cookiecutter.project_name}}_mongo
      - {{cookiecutter.project_name}}_redis

  # nginx:
  #   container_name: nginx
  #   image: nginx:stable-alpine
  #   ports:
  #     - '8080:443'
  #   volumes:
  #     - $PWD/nginx/dist/:/dist/
  #     - $PWD/nginx/conf/:/etc/nginx/conf.d/
  #     - $PWD/nginx/nginx.conf:/etc/nginx/nginx.conf
  #     - $PWD/log/nginx:/var/log/nginx

  {{cookiecutter.project_name}}_redis:
    container_name: {{cookiecutter.project_name}}_redis
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/quay.io/opstree/redis:v7.0.5
    restart: always
    ports:
      - '6379:6379'

  {{cookiecutter.project_name}}_mongo:
    container_name: {{cookiecutter.project_name}}_mongo
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/mongo:latest
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: 123456

    volumes:
      - mongodb-data:/data/db

volumes:
  mongodb-data:
